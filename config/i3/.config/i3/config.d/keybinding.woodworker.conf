##
## KEYBINDINGS
##

# First modifier: GUI
set $m Mod4
# Second modifier: CTRL + GUI
set $m2 Ctrl+Mod4
# Third modifier: CTRL + GUI + ALT
set $m3 Ctrl+Mod4+Mod1

# Use Mouse+$m to drag floating windows to their wanted position
floating_modifier $m

# Top Row
set $kc_q 24
set $kc_c 25
set $kc_o 26
set $kc_p 27
set $kc_w 28
set $kc_j 29
set $kc_m 30
set $kc_d 31
set $kc_star 32
set $kc_y 33

# Home Row
set $kc_a 38
set $kc_s 39
set $kc_e 40
set $kc_n 41
set $kc_f 42
set $kc_l 43
set $kc_r 44
set $kc_t 45
set $kc_i 46
set $kc_u 47

# Bottom Row
set $kc_z 52
set $kc_x 53
set $kc_minus 54
set $kc_v 55
set $kc_b 56
set $kc_dot 57
set $kc_h 58
set $kc_g 59
set $kc_comma   60
set $kc_k 61

#------------------------
# Modes
#------------------------

bindcode $m  + $kc_n layout toggle tabbed splith
bindcode $m2 + $kc_n split h
bindcode $m  + $kc_e layout toggle stacking splitv
bindcode $m2 + $kc_e split v

bindcode $m  + $kc_minus fullscreen toggle
bindcode $m2 + $kc_minus sticky toggle

bindcode $m  + $kc_b focus floating
bindcode $m2 + $kc_b floating toggle

bindcode $m  + $kc_v scratchpad show
bindcode $m2 + $kc_v move scratchpad

#------------------------
# Resize
#------------------------

bindcode $m + $kc_l mode "resize"
mode "resize" {
  # These bindings trigger as soon as you enter the resize mode
  bindsym Left resize shrink width 10 px or 10 ppt
  bindsym Down resize grow height 10 px or 10 ppt
  bindsym Up resize shrink height 10 px or 10 ppt
  bindsym Right resize grow width 10 px or 10 ppt
  bindcode $kc_r resize shrink width 10 px or 10 ppt
  bindcode $kc_t resize grow height 10 px or 10 ppt
  bindcode $kc_i resize shrink height 10 px or 10 ppt
  bindcode $kc_u resize grow width 10 px or 10 ppt

  # back to normal: Enter or Escape
  bindsym Return mode "default"
  bindsym Escape mode "default"
}


#------------------------
# Window focus / movement
#------------------------

# Focus
bindsym $m + Left focus left
bindsym $m + Down focus down
bindsym $m + Up focus up
bindsym $m + Right focus right

bindcode $m + $kc_r focus left
bindcode $m + $kc_t focus down
bindcode $m + $kc_i focus up
bindcode $m + $kc_u focus right

# Move
bindsym $m2 + Left move left
bindsym $m2 + Down move down
bindsym $m2 + Up move up
bindsym $m2 + Right move right
bindcode $m2 + $kc_r move left
bindcode $m2 + $kc_t move down
bindcode $m2 + $kc_i move up
bindcode $m2 + $kc_u move right

# Move workspace
bindsym $m3 + Left move workspace to output left
bindsym $m3 + Down move workspace to output down
bindsym $m3 + Up move workspace to output up
bindsym $m3 + Right move workspace to output right
bindcode $m3 + $kc_r move workspace to output left
bindcode $m3 + $kc_t move workspace to output down
bindcode $m3 + $kc_i move workspace to output up
bindcode $m3 + $kc_u move workspace to output right

#------------------------
# Workspaces
#------------------------

bindsym $m + 1 workspace $ws1
bindsym $m + 2 workspace $ws2
bindsym $m + 3 workspace $ws3
bindsym $m + 4 workspace $ws4
bindsym $m + 5 workspace $ws5
bindsym $m + 6 workspace $ws6
bindsym $m + 7 workspace $ws7
bindsym $m + 8 workspace $ws8
bindsym $m + 9 workspace $ws9
bindsym $m + 0 workspace $ws10

bindsym $m2 + 1 move container to workspace $ws1
bindsym $m2 + 2 move container to workspace $ws2
bindsym $m2 + 3 move container to workspace $ws3
bindsym $m2 + 4 move container to workspace $ws4
bindsym $m2 + 5 move container to workspace $ws5
bindsym $m2 + 6 move container to workspace $ws6
bindsym $m2 + 7 move container to workspace $ws7
bindsym $m2 + 8 move container to workspace $ws8
bindsym $m2 + 9 move container to workspace $ws9
bindsym $m2 + 0 move container to workspace $ws10

bindcode $m + $kc_q    workspace $ws1
bindcode $m + $kc_c    workspace $ws2
bindcode $m + $kc_o    workspace $ws3
bindcode $m + $kc_p    workspace $ws4
bindcode $m + $kc_w    workspace $ws5
bindcode $m + $kc_j    workspace $ws6
bindcode $m + $kc_m    workspace $ws7
bindcode $m + $kc_d    workspace $ws8
bindcode $m + $kc_star workspace $ws9
bindcode $m + $kc_y    workspace $ws10

bindcode $m2 + $kc_q    move container to workspace $ws1
bindcode $m2 + $kc_c    move container to workspace $ws2
bindcode $m2 + $kc_o    move container to workspace $ws3
bindcode $m2 + $kc_p    move container to workspace $ws4
bindcode $m2 + $kc_w    move container to workspace $ws5
bindcode $m2 + $kc_j    move container to workspace $ws6
bindcode $m2 + $kc_m    move container to workspace $ws7
bindcode $m2 + $kc_d    move container to workspace $ws8
bindcode $m2 + $kc_star move container to workspace $ws9
bindcode $m2 + $kc_y    move container to workspace $ws10


#------------------------
# System
#------------------------

# BRIGHTNESS
bindsym XF86MonBrightnessDown exec "light -U 10"
bindsym XF86MonBrightnessUp exec "light -A 10"

# VOLUME
bindsym XF86AudioRaiseVolume exec pactl set-sink-volume @DEFAULT_SINK@ +2%
bindsym XF86AudioLowerVolume exec pactl set-sink-volume @DEFAULT_SINK@ -2%
bindsym XF86AudioMute exec --no-startup-id pactl set-sink-mute @DEFAULT_SINK@ toggle

# SCREEN SHOT
bindsym Print exec xfce4-screenshooter


#------------------------
# Applications
#------------------------

# USE ROFI TO OPEN AN APPLICATION
bindsym $m + space exec rofi -show drun

# OPEN TERMINAL
bindsym $m + Return exec kitty
bindsym $m + BackSpace exec kitty

# KILL FOCUSED WINDOW (which are not VDI)
bindcode $m2 + $kc_s kill


#------------------------
## DISPLAY ##
#------------------------

# DISPLAY
bindcode $m + $kc_f exec . $HOME/.mybin/display.sh

# LOCK SCREEN
bindcode $m2 + $kc_f exec . $HOME/.config/i3/scripts/i3-lock.sh


#------------------------
## I3 SYSTEM ##
#------------------------

# RELOAD THE CONFIG / RESTART I3 INPLACE
bindcode $m  + $kc_a reload
bindcode $m2 + $kc_a restart

# QUIT I3
bindcode $m2 + $kc_z exec "i3-nagbar -t warning -m 'You pressed the exit shortcut. Do you really want to exit i3? This will end your X session.' -b 'Yes, exit i3' 'i3-msg exit'"
